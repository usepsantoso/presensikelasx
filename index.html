    <script>
      (function() {
        // Provide both getter and setter for window.fetch to prevent browser extension crashes
        try {
          var _rawFetch = window.fetch;
          var _currentFetch = function() {
            return (_rawFetch || window.fetch).apply(window, arguments);
          };
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _currentFetch;
            },
            set: function(newFetch) {
              _currentFetch = newFetch;
            }
          });
        } catch (e) {
          // Fallback gracefully
        }

        // Prevent external chrome-extension errors from disrupting the web app
        window.addEventListener('error', function(e) {
          if (
            (e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
            (e.message && e.message.indexOf('Cannot set property fetch') !== -1)
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
